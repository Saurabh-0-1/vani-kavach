<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Create Account | Vani Kavach</title><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="premium.css" /></head>
  <body class="auth-page"><header class="auth-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>Vani <strong>Kavach</strong></span></a><a href="index.html" class="back-link">← Home</a></header><main class="auth-main"><section class="auth-card"><p class="eyebrow"><span></span> Start investigating</p><h1>Create account.</h1><p class="auth-intro">Set up your profile for a future evidence-aware workspace.</p><form data-form-kind="signup" novalidate><label for="full-name">Full name<input id="full-name" name="fullName" type="text" autocomplete="name" required /></label><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required /></label><label for="password">Password<div class="password-field"><input id="password" name="password" type="password" autocomplete="new-password" required /><button type="button" data-password-toggle="password">Show</button></div><small class="field-hint">Use at least 8 characters.</small></label><label for="confirm-password">Confirm password<div class="password-field"><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required /><button type="button" data-password-toggle="confirm-password">Show</button></div></label><button class="button button-primary form-submit" type="submit">Create account <span>→</span></button><p class="form-message" role="status" aria-live="polite"></p></form><div class="auth-links"><span>Already have an account? <a href="login.html">Log in</a></span></div><p class="backend-note">Registration is not currently implemented in the FastAPI backend. No password is saved in this browser.</p></section></main><script src="shared.js"></script></body>
</html>
